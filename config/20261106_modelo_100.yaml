_target_: UniT.workspace.train_vqvae_representation_workspace.TrainVqvaeRepresentationWorkspace
base_learning_rate: 4.5e-6

shape_meta: &shape_meta
  obs:    
    tactile_image:
      shape: [3, 128, 160]
      type: rgb
with_vq: true
model:
  embed_dim: 3
  n_embed: 1024
  ddconfig:
    double_z: False
    z_channels: 3
    resolution: 128
    in_channels: 3
    out_ch: 3
    ch: 128
    ch_mult: [1,1,1,1] # representation shape 16x20
    num_res_blocks: 2
    attn_resolutions: [16]
    dropout: 0.0
  lossconfig:
    target: UniT.taming.modules.losses.vqperceptual.VQLPIPSWithDiscriminator
    params:
      disc_conditional: False
      disc_in_channels: 3
      disc_start: 10000
      disc_weight: 0.8
      codebook_weight: 1.0
dataset:
  resized_image_shape: [128, 160]
  shape_meta:
    obs:    
      tactile_image:
        shape: [3, 128, 160]
        type: rgb

  dataset_path: data/julio_wth_markers/train/dataset/
  horizon: 1
  max_train_episodes: null
  pad_after: 1
  pad_before: 1
  seed: 42
  val_ratio: 15
  # Data augmentation de color solo sobre la entrada; el objetivo de
  # reconstruccion se mantiene limpio (ver UniT/dataset/color_augmentation.py).
  augmentation:
    brightness: 0.3   # factor en [1-m, 1+m]
    contrast: 0.3
    saturation: 0.3
    hue: 0.1          # desplazamiento de tono en [-h, h] (fraccion del circulo)
    noise_std: 0.0    # ruido gaussiano opcional (ablacion color + ruido)
    prob: 1.0
val_dataloader:
  batch_size: 128
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: false
dataloader:
  batch_size: 32
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: true
gpus: '0,'
batch_size: 32
seed: 42
trainer:
  name: "vq_representiaon_dubug"
  resume: ""
  base: []
  no_test: false
  project: null
  debug: false
  seed: 42
  postfix: ""
  train: true
  save_every: 1
  max_epochs: 35
